# 复制到服务器 /etc/nginx/sites-available/lingxi 后按需改域名与路径，再 ln -s 到 sites-enabled
# 假设：前端静态资源在 /var/www/lingxi/dist，后端监听 127.0.0.1:8000

server {
    listen 80;
    server_name _;   # 改成你的域名，例如 petct.example.com

    root /var/www/lingxi/dist;
    index index.html;

    # 单页应用：非文件路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100m;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }

    location /schema/ {
        proxy_pass http://127.0.0.1:8000/schema/;
        proxy_set_header Host $host;
    }
}
